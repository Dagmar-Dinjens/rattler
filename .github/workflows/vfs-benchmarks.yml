on:
  workflow_dispatch:
    inputs:
      runs-warm:
        description: Runs per warm exec benchmark
        default: "10"
      runs-fresh:
        description: Runs per fresh-env exec benchmark
        default: "5"
      runs-cold:
        description: Runs per cold-cache exec benchmark
        default: "3"
  push:
    branches: [vfs-benchmarks]
    paths:
      - crates/rattler_vfs/**
      - crates/rattler-bin/src/commands/exec.rs
      - scripts/bench/**
      - .github/workflows/vfs-benchmarks.yml

name: rattler_vfs Benchmarks

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  bench:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux, os: ubuntu-latest, exe: ""}
          - {name: macos, os: macos-14, exe: ""}
          - {name: windows, os: windows-latest, exe: ".exe"}

    steps:
      - name: Checkout source code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
          persist-credentials: false

      # Only for the `pixi` binary being benchmarked; nothing is installed.
      - uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          run-install: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install FUSE (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fuse3

      - name: Enable ProjFS (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: Enable-WindowsOptionalFeature -Online -FeatureName Client-ProjFS -NoRestart

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: vfs-bench

      - name: Build rattler (release)
        run: cargo build --release -p rattler-bin

      - name: Machine info
        shell: bash
        run: |
          uname -a || true
          nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo "$NUMBER_OF_PROCESSORS"
          pixi --version
          ./target/release/rattler${{ matrix.exe }} --version

      - name: Criterion benchmarks (rattler_vfs)
        timeout-minutes: 90
        shell: bash
        run: cargo bench -p rattler_vfs --bench prefix_replacement --bench vfs_ops --bench spinup 2>&1 | tee criterion.log

      - name: Keep criterion log
        if: ${{ !cancelled() }}
        shell: bash
        run: mkdir -p bench-results/${{ matrix.name }} && cp criterion.log bench-results/${{ matrix.name }}/ || true

      - name: Collect criterion results
        if: always()
        run: python scripts/bench/vfs_bench_report.py collect-criterion target/criterion bench-results/${{ matrix.name }}/criterion-results.json

      - name: Exec benchmarks (pixi vs rattler vs rattler --dematerialized)
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        shell: bash
        env:
          RUNS_WARM: ${{ inputs.runs-warm || '10' }}
          RUNS_FRESH: ${{ inputs.runs-fresh || '5' }}
          RUNS_COLD: ${{ inputs.runs-cold || '3' }}
        run: >
          python scripts/bench/vfs_exec_bench.py
          --rattler "target/release/rattler${{ matrix.exe }}"
          --out "bench-results/${{ matrix.name }}"
          --work-dir "$RUNNER_TEMP/vfs-exec-bench"
          --runs-warm "$RUNS_WARM"
          --runs-fresh "$RUNS_FRESH"
          --runs-cold "$RUNS_COLD"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vfs-bench-${{ matrix.name }}
          path: bench-results/${{ matrix.name }}

      - name: Cleanup mounts
        if: always()
        shell: bash
        run: |
          for mnt in "${RUNNER_TEMP:-/tmp}"/vfs-exec-bench/caches/*/exec/*; do
            sudo umount -f "$mnt" 2>/dev/null || true
            fusermount3 -u "$mnt" 2>/dev/null || true
          done
          taskkill /F /IM rattler.exe 2>/dev/null || true

  report:
    needs: bench
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vfs-bench-*
          path: bench-results

      - name: Build report
        run: |
          dirs=$(ls -d bench-results/vfs-bench-* 2>/dev/null)
          python3 scripts/bench/vfs_bench_report.py report $dirs > bench-results/report.md
          cat bench-results/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vfs-bench-report
          path: bench-results
