on:
  workflow_dispatch:
  push:
    branches: [debug-exec-stall]

name: exec stall repro

permissions:
  contents: read

jobs:
  repro:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
      - uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          run-install: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: vfs-bench
      - name: Build rattler (release)
        run: cargo build --release -p rattler-bin
      - name: Repro
        shell: bash
        run: |
          R=$PWD/target/release/rattler
          export RATTLER_CACHE_DIR=$RUNNER_TEMP/rc
          export PIXI_CACHE_DIR=$RUNNER_TEMP/pc
          mkdir -p logs
          ts() { python3 -u -c "import sys,time;t0=time.time()
          for l in sys.stdin: sys.stdout.write('%7.2f %s'%(time.time()-t0,l))"; }
          CMD=(exec -s python=3.12 -s numpy=2 -- python -c "import numpy; print(numpy.__version__)")
          # prime repodata
          $R "${CMD[@]}" > logs/prime.log 2>&1 || true
          run() {
            name=$1; shift
            rm -rf "$RATTLER_CACHE_DIR/pkgs" "$RATTLER_CACHE_DIR/exec"
            start=$(date +%s.%N)
            env "$@" RUST_LOG=${LOG:-info} $R "${CMD[@]}" 2>&1 | ts > logs/$name.log || true
            echo "$name: $(python3 -c "print(round($(date +%s.%N)-$start,1))")s" | tee -a logs/summary.txt
          }
          run default-1 X=1
          run default-2 X=1
          LOG="info,rattler_cache=debug,h2=debug,hyper_util=debug,reqwest=debug" run default-h2log X=1
          run readtimeout10 DBG_READ_TIMEOUT=10
          run http1 DBG_HTTP1=1
          run http1-2 DBG_HTTP1=1
          run adaptive DBG_ADAPTIVE=1
          rm -rf "$PIXI_CACHE_DIR"
          pixi exec -s python=3.12 -s numpy=2 -- python -c "import numpy" >/dev/null 2>&1
          rm -rf "$PIXI_CACHE_DIR/pkgs"
          start=$(date +%s.%N)
          pixi exec -vv -s python=3.12 -s numpy=2 -- python -c "import numpy" 2>&1 | ts > logs/pixi-cold.log || true
          echo "pixi cold: $(python3 -c "print(round($(date +%s.%N)-$start,1))")s" | tee -a logs/summary.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: stall-${{ matrix.os }}
          path: logs
